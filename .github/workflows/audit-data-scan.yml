name: Audit Data Scan on Production

# READ-ONLY skan baz portfeli pod kątem artefaktów błędów naprawionych
# w audycie 2026-06 (PR #58-#71): auto-splity z datą detekcji, syntetyczne
# SELL z błędnym payment_currency, kandydaci do reconcile-all, sygnatury
# prowizji XTB same-second. Niczego nie modyfikuje.

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Scan
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd /opt/ike-terminal/app &&
            DATA_DIR=/opt/ike-terminal/data node server/dist/scripts/scan-audit-artifacts.js
          "
