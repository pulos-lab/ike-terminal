name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deploy archive
        run: |
          tar czf deploy.tar.gz \
            client/dist/ server/dist/ shared/dist/ \
            package.json package-lock.json \
            server/package.json shared/package.json client/package.json

      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp/

      - name: Deploy & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ike-terminal/app
            tar xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            npm ci --omit=dev
            systemctl restart ike-terminal
            sleep 3
            curl -sf https://tixterminal.app/api/health || exit 1
