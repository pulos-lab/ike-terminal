name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo SSH_OK"

      - name: Deploy files
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          SSH="ssh -i ~/.ssh/deploy_key"
          REMOTE="/opt/ike-terminal/app"

          rsync -az --delete -e "$SSH" server/dist/ $USER@$HOST:$REMOTE/server/dist/
          rsync -az --delete -e "$SSH" client/dist/ $USER@$HOST:$REMOTE/client/dist/
          rsync -az --delete -e "$SSH" shared/dist/ $USER@$HOST:$REMOTE/shared/dist/

          rsync -az -e "$SSH" package.json package-lock.json $USER@$HOST:$REMOTE/
          $SSH $USER@$HOST "mkdir -p $REMOTE/server $REMOTE/shared $REMOTE/client"
          rsync -az -e "$SSH" server/package.json $USER@$HOST:$REMOTE/server/
          rsync -az -e "$SSH" shared/package.json $USER@$HOST:$REMOTE/shared/
          rsync -az -e "$SSH" client/package.json $USER@$HOST:$REMOTE/client/

          rsync -az -e "$SSH" benchmark/ $USER@$HOST:$REMOTE/benchmark/

      - name: Install deps, seed benchmarks & restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/ike-terminal/app &&
            npm ci --omit=dev &&
            DATA_DIR=/opt/ike-terminal/data node server/dist/seed-benchmarks.js &&
            sudo systemctl restart ike-terminal
          '

      - name: Health check
        run: |
          sleep 3
          curl -sf https://tixterminal.app/api/health

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
