name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy client dist
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: client/dist/
          remote_path: /opt/ike-terminal/app/client/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy server dist
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: server/dist/
          remote_path: /opt/ike-terminal/app/server/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy shared dist
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: shared/dist/
          remote_path: /opt/ike-terminal/app/shared/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy package files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: package.json package-lock.json
          remote_path: /opt/ike-terminal/app/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy workspace package.json files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/ike-terminal/app/server /opt/ike-terminal/app/shared /opt/ike-terminal/app/client

      - name: Deploy server package.json
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: server/package.json
          remote_path: /opt/ike-terminal/app/server/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy shared package.json
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: shared/package.json
          remote_path: /opt/ike-terminal/app/shared/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy client package.json
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az
          path: client/package.json
          remote_path: /opt/ike-terminal/app/client/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install production dependencies
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ike-terminal/app
            npm ci --omit=dev

      - name: Restart service & health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            systemctl restart ike-terminal
            sleep 3
            curl -sf https://tixterminal.app/api/health || exit 1
