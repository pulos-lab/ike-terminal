name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:

# Serializacja deployów: równoległe merge'e do main powodowały wyścig —
# health check jednego runa trafiał w restart serwera z drugiego runa.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify lockfile has Linux platform deps
        run: |
          if ! grep -q '"node_modules/@rollup/rollup-linux-x64-gnu"' package-lock.json; then
            echo "::error::package-lock.json is missing the @rollup/rollup-linux-x64-gnu entry."
            echo "This typically happens when the lockfile was regenerated on macOS without the Linux optional deps."
            echo "Fix locally: rm -rf node_modules package-lock.json && npm install"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

  deploy:
    needs: format-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prod-deps smoke test
        # Symulacja produkcyjnej instalacji PRZED rsync: prod robi
        # `npm ci --omit=dev`, więc zależność runtime omyłkowo wpisana do
        # devDependencies (incydent cheerio, PR #77/#78 — crash loop i 502)
        # wywala serwer dopiero po restarcie na VPS. Tutaj: kopia plików
        # dokładnie w układzie produkcyjnym, instalacja bez devDeps i start
        # serwera — jeśli proces nie przeżyje 8 s (ERR_MODULE_NOT_FOUND
        # zabija go natychmiast), deploy nie rusza.
        run: |
          SMOKE=$(mktemp -d)
          mkdir -p "$SMOKE/server" "$SMOKE/shared" "$SMOKE/client"
          cp package.json package-lock.json "$SMOKE/"
          cp server/package.json "$SMOKE/server/"
          cp shared/package.json "$SMOKE/shared/"
          cp client/package.json "$SMOKE/client/"
          cp -r server/dist "$SMOKE/server/dist"
          cp -r shared/dist "$SMOKE/shared/dist"
          cd "$SMOKE"
          npm ci --omit=dev
          DATA_DIR=$(mktemp -d) node server/dist/index.js > smoke.log 2>&1 &
          SERVER_PID=$!
          sleep 8
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Serwer padł przy starcie na produkcyjnym zestawie zależności (npm ci --omit=dev). Log:"
            cat smoke.log
            exit 1
          fi
          kill $SERVER_PID
          echo "OK — serwer wstał na samych dependencies (bez devDependencies)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo SSH_OK"

      - name: Deploy files
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          SSH="ssh -i ~/.ssh/deploy_key"
          REMOTE="/opt/ike-terminal/app"
          # Deploy user is root; without --chown rsync preserves the runner's
          # uid (1001) which is orphaned on the VPS, breaking later npm ci.
          CHOWN="--chown=ike-terminal:ike-terminal"

          rsync -az $CHOWN --delete -e "$SSH" server/dist/ $USER@$HOST:$REMOTE/server/dist/
          rsync -az $CHOWN --delete -e "$SSH" client/dist/ $USER@$HOST:$REMOTE/client/dist/
          rsync -az $CHOWN --delete -e "$SSH" shared/dist/ $USER@$HOST:$REMOTE/shared/dist/

          rsync -az $CHOWN -e "$SSH" package.json package-lock.json $USER@$HOST:$REMOTE/
          $SSH $USER@$HOST "mkdir -p $REMOTE/server $REMOTE/shared $REMOTE/client"
          rsync -az $CHOWN -e "$SSH" server/package.json $USER@$HOST:$REMOTE/server/
          rsync -az $CHOWN -e "$SSH" shared/package.json $USER@$HOST:$REMOTE/shared/
          rsync -az $CHOWN -e "$SSH" client/package.json $USER@$HOST:$REMOTE/client/

          rsync -az $CHOWN -e "$SSH" benchmark/ $USER@$HOST:$REMOTE/benchmark/

      - name: Install deps, seed benchmarks & restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/ike-terminal/app &&
            npm ci --omit=dev &&
            DATA_DIR=/opt/ike-terminal/data node server/dist/seed-benchmarks.js &&
            sudo systemctl restart ike-terminal
          '

      - name: Health check
        run: |
          sleep 3
          curl -sf https://tixterminal.app/api/health

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
