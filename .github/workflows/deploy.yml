name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SERVER="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          REMOTE_DIR="/opt/ike-terminal/app"

          rsync -az --delete -e "ssh $SSH_OPTS" client/dist/ "$SERVER:$REMOTE_DIR/client/dist/"
          rsync -az --delete -e "ssh $SSH_OPTS" server/dist/ "$SERVER:$REMOTE_DIR/server/dist/"
          rsync -az --delete -e "ssh $SSH_OPTS" shared/dist/ "$SERVER:$REMOTE_DIR/shared/dist/"

          rsync -az -e "ssh $SSH_OPTS" package.json package-lock.json "$SERVER:$REMOTE_DIR/"
          ssh $SSH_OPTS "$SERVER" "mkdir -p $REMOTE_DIR/server $REMOTE_DIR/shared $REMOTE_DIR/client"
          rsync -az -e "ssh $SSH_OPTS" server/package.json "$SERVER:$REMOTE_DIR/server/"
          rsync -az -e "ssh $SSH_OPTS" shared/package.json "$SERVER:$REMOTE_DIR/shared/"
          rsync -az -e "ssh $SSH_OPTS" client/package.json "$SERVER:$REMOTE_DIR/client/"

          ssh $SSH_OPTS "$SERVER" "cd $REMOTE_DIR && npm ci --omit=dev"

      - name: Restart service & health check
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SERVER="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh $SSH_OPTS "$SERVER" "systemctl restart ike-terminal && sleep 3 && curl -sf https://tixterminal.app/api/health"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
