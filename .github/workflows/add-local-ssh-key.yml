name: Add local machine SSH key (one-off)

# JEDNORAZOWY workflow: dopisuje klucz publiczny laptopa Łukasza do
# authorized_keys konta ike-terminal na VPS (z ochroną przed duplikatem).
# Do USUNIĘCIA natychmiast po wykonaniu — nie zostawiamy w repo mechanizmu
# dopisywania kluczy SSH.

on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Append public key (idempotent)
        run: |
          PUBKEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJkHh2rLqTuf+U5cGeoMsuuoTiAbG7ozYAEGfx/kNH3W lukasz@laptop'
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys &&
            grep -qxF '$PUBKEY' ~/.ssh/authorized_keys || echo '$PUBKEY' >> ~/.ssh/authorized_keys &&
            echo 'KEY_PRESENT:' && grep -c 'lukasz@laptop' ~/.ssh/authorized_keys
          "
