<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon celowo BEZ @media prefers-color-scheme — próbowaliśmy, wycofane.
      Safari stosuje ten blok tylko na karcie zaznaczonej, a pasek kart tintuje
      pod kolor STRONY (u nas ciemny), podczas gdy prefers-color-scheme mówi
      o motywie SYSTEMU. Efekt: ciemna litera lądowała na ciemnym pillu, więc
      Safari ratowało kontrast, podkładając białą płytkę. Biały T bez media
      query jest czytelny na ciemnym pasku i nie wywołuje tego zachowania.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='73' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-weight='700' font-size='64'><tspan fill='%23f59e0b'>[</tspan><tspan fill='%23fafaf9'>T</tspan><tspan fill='%23f59e0b'>]</tspan></text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIX Terminal — portfel inwestycyjny dla polskich inwestorów</title>
    <meta
      name="description"
      content="Cały portfel z wielu brokerów w jednym miejscu: import wyciągów z XTB, mBanku, Bossy, DEGIRO i IBKR, dywidendy z podatkiem u źródła, limity IKE/IKZE, wynik vs WIG i S&P 500."
    />
    <!-- Open Graph / Twitter — celowo bez og:url i canonical: ten sam plik jest
         serwowany także dla /share/:token, a og:url wskazujący stronę główną
         przekłamywałby podglądy udostępnionych portfeli. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TIX Terminal" />
    <meta
      property="og:title"
      content="TIX Terminal — portfel inwestycyjny dla polskich inwestorów"
    />
    <meta
      property="og:description"
      content="Import wyciągów z XTB, mBanku, Bossy, DEGIRO i IBKR. Dywidendy, podatki, limity IKE/IKZE i wynik vs WIG — w jednym miejscu. Za darmo."
    />
    <meta property="og:image" content="https://tixterminal.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pl_PL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tixterminal.app/og-image.png" />
    <meta name="theme-color" content="#0b0a09" />
    <script
      data-goatcounter="https://stats.tixterminal.app/count"
      async
      src="//stats.tixterminal.app/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
