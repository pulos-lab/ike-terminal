<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon celowo BEZ @media prefers-color-scheme — próbowaliśmy, wycofane.
      Safari stosuje ten blok tylko na karcie zaznaczonej, a pasek kart tintuje
      pod kolor STRONY (u nas ciemny), podczas gdy prefers-color-scheme mówi
      o motywie SYSTEMU. Efekt: ciemna litera lądowała na ciemnym pillu, więc
      Safari ratowało kontrast, podkładając białą płytkę. Biały T bez media
      query jest czytelny na ciemnym pasku i nie wywołuje tego zachowania.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='73' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-weight='700' font-size='64'><tspan fill='%23f59e0b'>[</tspan><tspan fill='%23fafaf9'>T</tspan><tspan fill='%23f59e0b'>]</tspan></text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIX Terminal</title>
    <script
      data-goatcounter="https://stats.tixterminal.app/count"
      async
      src="//stats.tixterminal.app/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
